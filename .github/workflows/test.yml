name: Cross-Platform Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.8"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit test suite
        run: |
          pytest -v

      - name: Test CLI help output
        run: |
          python devsweep.py --help

      - name: Test non-destructive quick scan and report generation
        run: |
          python devsweep.py --skip-projects --json ci-report.json --markdown ci-report.md --redact

      - name: Verify generated report files exist
        shell: bash
        run: |
          if [ ! -s ci-report.json ]; then
            echo "Error: ci-report.json was not generated or is empty"
            exit 1
          fi
          if [ ! -s ci-report.md ]; then
            echo "Error: ci-report.md was not generated or is empty"
            exit 1
          fi
          echo "All report artifacts successfully verified!"

      - name: Test launcher scripts (macOS & Linux)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./ds
          ./ds help

      - name: Test launcher scripts (Windows)
        if: runner.os == 'Windows'
        run: |
          pwsh ./ds.ps1 help
          cmd /c ds.bat help

      - name: Test cleanup script generation and syntax (macOS & Linux)
        if: runner.os != 'Windows'
        run: |
          python devsweep.py --skip-projects --generate-script ci-cleanup.sh
          bash -n ci-cleanup.sh
          echo "ci-cleanup.sh syntax successfully verified!"

      - name: Test cleanup script generation and syntax (Windows)
        if: runner.os == 'Windows'
        run: |
          python devsweep.py --skip-projects --generate-script ci-cleanup.ps1
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('ci-cleanup.ps1', [ref]$null, [ref]$parseErrors)
          if ($parseErrors) {
            Write-Error ("PowerShell syntax error: " + ($parseErrors | Out-String))
            exit 1
          }
          Write-Host "ci-cleanup.ps1 syntax successfully verified!"
