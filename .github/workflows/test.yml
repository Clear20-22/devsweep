name: Cross-Platform Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.8"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit test suite
        run: |
          pytest -v

      - name: Test CLI help output
        run: |
          python devsweep.py --help

      - name: Test non-destructive quick scan and report generation
        run: |
          python devsweep.py --skip-projects --json ci-report.json --markdown ci-report.md --redact

      - name: Verify generated report files exist
        shell: bash
        run: |
          if [ ! -s ci-report.json ]; then
            echo "Error: ci-report.json was not generated or is empty"
            exit 1
          fi
          if [ ! -s ci-report.md ]; then
            echo "Error: ci-report.md was not generated or is empty"
            exit 1
          fi
          echo "All report artifacts successfully verified!"
