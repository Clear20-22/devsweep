[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devsweep"
version = "1.0.0"
description = "Non-destructive developer bloat and storage auditor for macOS, Linux, and Windows."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Jubayer Ahmed Sojib", email = "sojib@example.com" }
]
keywords = ["cleanup", "disk-space", "developer-tools", "cache", "vscode", "docker", "python", "node", "storage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
devsweep = "devsweep.cli:main"
